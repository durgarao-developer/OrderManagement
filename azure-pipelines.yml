trigger:
  - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  appServiceName: 'ordermgmt-api-durgarao'

stages:
# ====== CI: Build + Test ======
- stage: Build
  displayName: 'CI - Build and Test'
  jobs:
  - job: BuildAndTest
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Unit Tests'
      inputs:
        command: 'test'
        projects: '**/OrderManagement.Tests.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build'

    - task: DotNetCoreCLI@2
      displayName: 'Publish API'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '**/OrderManagement.Api.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

# ====== CD: Deploy ======
- stage: Deploy
  displayName: 'CD - Deploy to App Service'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: PowerShell@2
      displayName: 'Deploy via Zip Deploy'
      env:
        DEPLOY_PASSWORD: $(publishProfilePassword)
      inputs:
        targetType: 'inline'
        script: |
          $zip = Get-ChildItem -Path "$(System.ArtifactsDirectory)/drop" -Filter *.zip -Recurse | Select-Object -First 1
          Write-Host "Deploying file: $($zip.FullName)"
          $user = '$ordermgmt-api-durgarao'
          $pass = $env:DEPLOY_PASSWORD
          $pair = "$($user):$($pass)"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          $headers = @{ Authorization = "Basic $encoded" }
          $url = "https://ordermgmt-api-durgarao-cxhjf0eqevd2hbf8.scm.centralindia-01.azurewebsites.net/api/zipdeploy"
          Invoke-RestMethod -Uri $url -Headers $headers -Method POST -InFile $zip.FullName -ContentType "application/zip" -TimeoutSec 300
          Write-Host "Deployment complete!"